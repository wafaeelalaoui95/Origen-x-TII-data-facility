<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Origen — TII Robotics Facility</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c10;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#fff}
#c{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;
  background:linear-gradient(180deg,rgba(0,0,0,0.82)0%,transparent);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;pointer-events:none}
.logo{height:24px;mix-blend-mode:screen;filter:brightness(1.5);pointer-events:all}
.stats{display:flex;gap:22px}
.stat .v{font-size:14px;font-weight:600}
.stat .l{font-size:8px;color:rgba(255,255,255,0.38);letter-spacing:.12em;text-transform:uppercase}
#cats{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;z-index:50;flex-wrap:wrap;justify-content:center}
.cbt{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:500;cursor:pointer;
  border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.65);color:rgba(255,255,255,0.6);
  backdrop-filter:blur(10px);transition:all .18s;letter-spacing:.04em;position:relative}
.cbt:hover{border-color:rgba(255,255,255,0.35);color:#fff}
.cbt.act{background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.35)}
.cbt .drop{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(8,10,16,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:8px;
  min-width:210px;padding:5px;opacity:0;pointer-events:none;transition:opacity .14s;
  backdrop-filter:blur(20px);box-shadow:0 -8px 32px rgba(0,0,0,0.6);z-index:100}
.cbt:hover .drop{opacity:1;pointer-events:all}
.di{padding:7px 11px;border-radius:4px;cursor:pointer;font-size:11px;color:rgba(255,255,255,0.65);
  display:flex;justify-content:space-between;align-items:center;transition:background .1s}
.di:hover{background:rgba(255,255,255,0.07);color:#fff}
.dm{font-size:9px;color:rgba(255,255,255,0.28);font-family:monospace}
#panel{position:fixed;right:0;top:0;bottom:0;width:296px;background:rgba(7,9,14,0.96);
  border-left:1px solid rgba(255,255,255,0.07);transform:translateX(296px);
  transition:transform .38s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column;
  backdrop-filter:blur(20px)}
#panel.open{transform:translateX(0)}
#ph{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.07);position:relative}
#pcls{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.07);border:none;
  color:rgba(255,255,255,0.5);width:25px;height:25px;border-radius:50%;cursor:pointer;font-size:13px}
#pcls:hover{background:rgba(255,255,255,0.14);color:#fff}
#pbadge{font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;
  border-radius:3px;display:inline-block;margin-bottom:8px}
#ptitle{font-size:19px;font-weight:500;margin-bottom:4px;line-height:1.2}
#psub{font-size:9px;color:rgba(255,255,255,0.32);letter-spacing:.07em;font-family:monospace}
#pbody{flex:1;overflow-y:auto;padding:14px 16px}
#pbody::-webkit-scrollbar{width:2px}
#pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1)}
.ps{margin-bottom:15px}.pst{font-size:8px;letter-spacing:.15em;color:rgba(255,255,255,0.26);
  text-transform:uppercase;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.06);font-family:monospace}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pc{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);padding:8px;border-radius:4px}
.pc .l{font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:.08em;text-transform:uppercase}
.pc .v{font-size:14px;font-weight:500;margin-top:2px}
.pc .v.g{color:#3ecf8e}
.pl{display:flex;flex-direction:column;gap:4px}
.pi{font-size:11px;color:rgba(255,255,255,0.55);display:flex;gap:6px;line-height:1.4}
.pi::before{content:"›";color:rgba(255,255,255,0.2)}
.po{background:rgba(62,207,142,0.06);border-left:2px solid #3ecf8e;padding:9px 11px;
  font-size:11px;line-height:1.7;color:rgba(255,255,255,0.55);font-style:italic;border-radius:0 4px 4px 0}
#pnav{padding:10px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:6px}
.nb{flex:1;padding:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);
  color:rgba(255,255,255,0.65);font-size:11px;cursor:pointer;border-radius:3px}
.nb:hover{background:rgba(255,255,255,0.1);color:#fff}
#back{position:fixed;top:66px;left:18px;z-index:50;background:rgba(0,0,0,0.72);
  border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.7);padding:6px 14px;
  font-size:11px;cursor:pointer;border-radius:4px;display:none;backdrop-filter:blur(10px);letter-spacing:.04em}
#back:hover{color:#fff}
#back.on{display:block}
#tip{position:fixed;pointer-events:none;z-index:60;background:rgba(0,0,0,0.9);
  border:1px solid rgba(255,255,255,0.12);padding:7px 11px;border-radius:4px;
  opacity:0;transition:opacity .1s;backdrop-filter:blur(10px);max-width:200px}
#tip.on{opacity:1}
#tip .tn{font-size:12px;font-weight:500}
#tip .tc{font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px;font-family:monospace}
#hint{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:50;
  background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.1);padding:6px 18px;
  border-radius:20px;font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:.04em;transition:opacity .5s}
</style>
</head>

function concreteTex(hexCol,rep=10){
  const sz=512,cv=document.createElement('canvas');
  cv.width=cv.height=sz;const ctx=cv.getContext('2d');
  const c=new THREE.Color(hexCol);
  ctx.fillStyle=`rgb(${~~(c.r*255)},${~~(c.g*255)},${~~(c.b*255)})`;
  ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<6000;i++){
    const a=Math.random()*0.028;
    ctx.fillStyle=Math.random()>.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a*.4})`;
    ctx.fillRect(Math.random()*sz,Math.random()*sz,Math.random()*3+1,Math.random()*2+1);
  }
  // tile joints
  ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1.5;
  for(let i=0;i<sz;i+=72){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,sz);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(sz,i);ctx.stroke();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return t;
}
function wallTex(){
  const sz=512,cv=document.createElement('canvas');
  cv.width=cv.height=sz;const ctx=cv.getContext('2d');
  ctx.fillStyle='#cdc9c4';ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<3000;i++){const a=Math.random()*.018;ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.arc(Math.random()*sz,Math.random()*sz,Math.random()*1.8+.3,0,Math.PI*2);ctx.fill();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,3);return t;
}
function steelTex(){
  const sz=256,cv=document.createElement('canvas');
  cv.width=cv.height=sz;const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,sz,sz);
  g.addColorStop(0,'#c8cdd8');g.addColorStop(.5,'#e8edf8');g.addColorStop(1,'#9aa0b2');
  ctx.fillStyle=g;ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<sz;i+=4){ctx.strokeStyle=`rgba(255,255,255,${Math.random()*.04})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(sz,i);ctx.stroke();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,4);return t;
}
function woodTex(){
  const sz=256,cv=document.createElement('canvas');
  cv.width=cv.height=sz;const ctx=cv.getContext('2d');
  ctx.fillStyle='#7a5a30';ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<40;i++){const y=i*7+Math.random()*4;ctx.strokeStyle=`rgba(${Math.random()>.5?0:255},${Math.random()>.5?0:255},0,0.04)`;ctx.lineWidth=Math.random()*3+1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(sz,y+Math.random()*6-3);ctx.stroke();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1);return t;
}

function makeCapsule(radius,height,mat){

// ── CAMERA CONTROL ─────────────────────────────────
let orbitR=66, orbitT=0.12, orbitP=0.58;
const orbitTgt=new THREE.Vector3(0,2,6);
let inStation=false, camAnim=false, dragging=false;
let prevX=0,prevY=0;

function applyOrbit(){
  if(inStation||camAnim)return;
  camera.position.set(
    orbitTgt.x+orbitR*Math.sin(orbitP)*Math.sin(orbitT),
    orbitTgt.y+orbitR*Math.cos(orbitP),
    orbitTgt.z+orbitR*Math.sin(orbitP)*Math.cos(orbitT)
  );
  camera.lookAt(orbitTgt);
}
applyOrbit();

function animCam(toPos,toLook,dur=1800){
  const fp=camera.position.clone();
  const fd=new THREE.Vector3();camera.getWorldDirection(fd);fd.multiplyScalar(8).add(camera.position);
  const t0=performance.now();camAnim=true;
  function step(now){
    const t=Math.min((now-t0)/dur,1);
    const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    camera.position.lerpVectors(fp,toPos,e);
    camera.lookAt(new THREE.Vector3().lerpVectors(fd,toLook,e));
    if(t<1)requestAnimationFrame(step);else camAnim=false;
  }
  requestAnimationFrame(step);
}

function flyToStation(id){
  curId=id;
  const pos=WP[id];if(!pos)return;
  // Camera positioned in FRONT of station, angled inward — never facing wall
  const camX=pos[0]+1.5, camZ=pos[1]+10, camY=3.8;
  const lookX=pos[0], lookZ=pos[1]-.5, lookY=1.6;
  animCam(new THREE.Vector3(camX,camY,camZ),new THREE.Vector3(lookX,lookY,lookZ));
  inStation=true;
  document.getElementById('back').classList.add('on');
  document.getElementById('hint').style.opacity='0';
  const st=ST.find(function(s){return s.id===id;});
  if(st)openPanel(st);
}

function backOv(){
  inStation=false;
  closePnl();
  document.getElementById('back').classList.remove('on');
  applyOrbit();
  animCam(camera.position.clone(),orbitTgt.clone(),1500);
  setTimeout(function(){document.getElementById('hint').style.opacity='1';},1200);
}

// ── ORBIT MOUSE ──────────────────────────────────────
document.getElementById('c').addEventListener('mousedown',function(e){dragging=false;prevX=e.clientX;prevY=e.clientY;});
document.addEventListener('mousemove',function(e){
  if(e.buttons===1&&!inStation){
    const dx=e.clientX-prevX,dy=e.clientY-prevY;
    if(Math.abs(dx)>2||Math.abs(dy)>2)dragging=true;
    orbitT-=dx*.0042;orbitP=Math.max(.1,Math.min(1.48,orbitP+dy*.0042));
    prevX=e.clientX;prevY=e.clientY;applyOrbit();
  }
  // Tooltip
  const mouse2=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(Object.values(stationObjs),true);
  const tip=document.getElementById('tip');
  if(hits.length){
    let o=hits[0].object;while(o&&!o.userData.stId)o=o.parent;
    if(o&&o.userData.stId){
      const st=ST.find(function(s){return s.id===o.userData.stId;});
      if(st){document.getElementById('ttn').textContent=st.name;document.getElementById('ttc').textContent=CATS[st.cat].name+' · '+st.count+'× · '+st.sqm+' m²';
        tip.classList.add('on');tip.style.left=(e.clientX+13)+'px';tip.style.top=(e.clientY+13)+'px';
        document.getElementById('c').style.cursor='pointer';return;}
    }
  }
  tip.classList.remove('on');document.getElementById('c').style.cursor='default';
});
document.getElementById('c').addEventListener('wheel',function(e){if(inStation)return;orbitR=Math.max(12,Math.min(110,orbitR+e.deltaY*.05));applyOrbit();},{passive:true});
document.getElementById('c').addEventListener('click',function(e){
  if(dragging)return;
  const mouse2=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(Object.values(stationObjs),true);
  if(hits.length){
    let o=hits[0].object;while(o&&!o.userData.stId)o=o.parent;
    if(o&&o.userData.stId)flyToStation(o.userData.stId);
  }
});

  const badge=document.getElementById('pbadge');
  badge.textContent=CATS[st.cat].name;
  badge.style.cssText='font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:3px;display:inline-block;margin-bottom:8px;background:'+hex+'28;color:'+hex+';border:1px solid '+hex+'55';
  document.getElementById('ptitle').textContent=st.name;
  document.getElementById('psub').textContent=st.num+' · '+(st.count>1?st.count+'× stations':'1 station')+' · A2 (Agibot)';
  document.getElementById('pbody').innerHTML='<div class="ps"><div class="pst">Metrics</div><div class="pg"><div class="pc"><div class="l">ID</div><div class="v">'+st.num+'</div></div><div class="pc"><div class="l">Count</div><div class="v">'+st.count+'×</div></div><div class="pc"><div class="l">Size</div><div class="v">'+st.sqm+' m²</div></div><div class="pc"><div class="l">Total</div><div class="v">'+st.sqm*st.count+' m²</div></div><div class="pc"><div class="l">Robot</div><div class="v g">A2</div></div><div class="pc"><div class="l">Category</div><div class="v" style="font-size:10px;font-family:monospace">'+CATS[st.cat].name+'</div></div></div></div><div class="ps"><div class="pst">Equipment</div><div class="pl">'+st.eq.map(function(e){return'<div class="pi">'+e+'</div>';}).join('')+'</div></div><div class="ps"><div class="pst">Dataset objective</div><div class="po">'+st.obj+'</div></div><div class="ps"><div class="pst">Capture</div><div class="pl"><div class="pi">Overhead RGB-D camera array</div><div class="pi">Wall-mounted tracking cams</div><div class="pi">Motion capture markers</div><div class="pi">Edge-compute terminal</div><div class="pi">Privacy partition panels</div></div></div>';
  document.getElementById('panel').classList.add('open');
}
function closePnl(){document.getElementById('panel').classList.remove('open');}
let curId=null;
function nav(dir){
  if(!curId){const first=ST[0];curId=first.id;flyToStation(curId);return;}
  const ids=ST.map(function(s){return s.id;});
  const i=ids.indexOf(curId);
  curId=ids[(i+dir+ids.length)%ids.length];flyToStation(curId);
}
// flyToStation tracks curId inline above

// ── RENDER LOOP ──────────────────────────────────────
const clock=new THREE.Clock();
renderer.setAnimationLoop(function(){
  if(!inStation&&!camAnim&&!dragging){orbitT+=.00025;applyOrbit();}
  renderer.render(scene,camera);
});
window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
